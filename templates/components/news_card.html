{% load az_dates %}
<article class="news-card news-card--{{ layout|default:'vertical' }}">
    <a href="{{ article.get_absolute_url }}" class="news-card__image-link">
        {% if article.featured_image.thumbnail %}
            <img src="{{ article.featured_image.thumbnail.url }}" alt="{{ article.featured_image.alt_text|default:article.title }}" class="news-card__image" loading="lazy">
        {% elif article.featured_image %}
            <img src="{{ article.featured_image.file.url }}" alt="{{ article.featured_image.alt_text|default:article.title }}" class="news-card__image" loading="lazy">
        {% else %}
            <span class="news-card__image news-card__image--placeholder" aria-hidden="true"></span>
        {% endif %}
    </a>
    <div class="news-card__body">
        <a href="{{ article.category.get_absolute_url }}" class="news-card__category">{{ article.category.name }}</a>
        <h3 class="news-card__title">
            <a href="{{ article.get_absolute_url }}">{{ article.title }}</a>
        </h3>
        <div class="news-card__meta">
            {{ article.published_at|az_timesince }}
            <span class="news-card__views"><i class="bi bi-eye" aria-hidden="true"></i> {{ article.view_count }}</span>
        </div>
    </div>
</article>
