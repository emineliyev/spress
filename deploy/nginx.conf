# Nginx site config for spress.az.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/spress.az
#          sudo ln -s /etc/nginx/sites-available/spress.az /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS itself isn't configured here — run `certbot --nginx -d spress.az
# -d www.spress.az` after this file is enabled; certbot edits this file
# in place to add the listen 443/ssl_certificate directives, which is
# the standard, supported way to manage them (hand-writing and
# maintaining them here would just drift from what certbot expects).

upstream spress_gunicorn {
    server unix:/run/spress/gunicorn.sock;
}

server {
    listen 80;
    server_name spress.az www.spress.az;

    client_max_body_size 20M;  # matches MAX_UPLOAD_SIZE_BYTES (apps/media_manager/services.py) plus headroom

    # Security headers (CLAUDE.md ch.12) — SecurityMiddleware already sets
    # X-Content-Type-Options/Referrer-Policy/HSTS at the Django layer; these
    # two are set here instead since they only make sense at the edge.
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /static/ {
        alias /opt/spress/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/spress/media/;
        expires 7d;
        access_log off;
    }

    # CLAUDE.md ch.12 "Never expose ... backups ... temporary files" —
    # never served even by accident, regardless of what Django does.
    location /media/temp/ {
        deny all;
    }

    location / {
        proxy_pass http://spress_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
