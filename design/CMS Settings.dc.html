<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { margin: 0; background: #f4f3f1; } * { box-sizing: border-box; } </style>
</helmet>

<div style="width: 1440px; margin: 0 auto; background: #fff; font-family: 'Noto Sans', system-ui, sans-serif; color: oklch(18% 0.006 25); display: flex; min-height: 900px;">
  <div style="width: 240px; flex: none; background: oklch(98% 0.003 25); border-right: 1px solid oklch(90% 0.004 25); padding: 24px 16px; display: flex; flex-direction: column; gap: 2px;">
    <div style="font-size: 18px; font-weight: 800; padding: 0 10px; margin-bottom: 24px;">XƏBƏR<span style="color: oklch(54% 0.22 25);">CMS</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>Dashboard</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="newspaper" style="width: 18px; height: 18px;"></i>Xəbərlər</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="folder-tree" style="width: 18px; height: 18px;"></i>Kateqoriyalar</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="image" style="width: 18px; height: 18px;"></i>Media</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="message-square" style="width: 18px; height: 18px;"></i>Şərhlər</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="users" style="width: 18px; height: 18px;"></i>İstifadəçilər</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="megaphone" style="width: 18px; height: 18px;"></i>Reklam</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="search-check" style="width: 18px; height: 18px;"></i>SEO</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="history" style="width: 18px; height: 18px;"></i>Fəaliyyət jurnalı</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: oklch(54% 0.22 25); color: #fff; border-radius: 4px; font-size: 14px; font-weight: 700; margin-top: auto;"><i data-lucide="settings" style="width: 18px; height: 18px;"></i>Tənzimləmələr</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column;">
    <div style="height: 64px; border-bottom: 1px solid oklch(90% 0.004 25); display: flex; align-items: center; justify-content: space-between; padding: 0 32px;">
      <div style="font-size: 18px; font-weight: 800;">Sayt Tənzimləmələri</div>
      <div style="display: flex; align-items: center; gap: 20px;"><i data-lucide="bell" style="width: 20px; height: 20px;"></i><div style="width: 32px; height: 32px; border-radius: 50%; background: oklch(90% 0.004 25);"></div></div>
    </div>
    <div style="padding: 32px; max-width: 780px; display: flex; flex-direction: column; gap: 28px;">
      <div>
        <div style="font-size: 15px; font-weight: 700; margin-bottom: 16px;">Ümumi</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border: 1px solid oklch(90% 0.004 25); border-radius: 4px; padding: 20px;">
          <div><div style="font-size: 12px; font-weight: 600; margin-bottom: 6px; color: oklch(40% 0.006 25);">Sayt adı</div><input value="XəbərPortal" style="width:100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid oklch(90% 0.004 25); border-radius: 2px;" /></div>
          <div><div style="font-size: 12px; font-weight: 600; margin-bottom: 6px; color: oklch(40% 0.006 25);">Dil</div><select style="width:100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid oklch(90% 0.004 25); border-radius: 2px;"><option>Azərbaycan</option></select></div>
          <div style="grid-column: span 2;"><div style="font-size: 12px; font-weight: 600; margin-bottom: 6px; color: oklch(40% 0.006 25);">Əlaqə e-poçtu</div><input value="redaksiya@xeberportal.az" style="width:100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid oklch(90% 0.004 25); border-radius: 2px;" /></div>
        </div>
      </div>
      <div>
        <div style="font-size: 15px; font-weight: 700; margin-bottom: 16px;">Menyu idarəetməsi</div>
        <div style="border: 1px solid oklch(90% 0.004 25); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><i data-lucide="grip-vertical" style="width:14px;height:14px;color:oklch(75% 0.005 25);"></i>Siyasət</div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><i data-lucide="grip-vertical" style="width:14px;height:14px;color:oklch(75% 0.005 25);"></i>İqtisadiyyat</div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><i data-lucide="grip-vertical" style="width:14px;height:14px;color:oklch(75% 0.005 25);"></i>Dünya</div>
        </div>
      </div>
      <button style="align-self: flex-start; font-family: inherit; font-weight: 700; font-size: 14px; padding: 12px 22px; background: oklch(54% 0.22 25); color: #fff; border: none; border-radius: 2px;">Yadda saxla</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() { return {}; }
}
</script>
</body>
</html>
