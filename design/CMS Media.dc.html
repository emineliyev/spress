<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { margin: 0; background: #f4f3f1; } * { box-sizing: border-box; } </style>
</helmet>

<div style="width: 1440px; margin: 0 auto; background: #fff; font-family: 'Noto Sans', system-ui, sans-serif; color: oklch(18% 0.006 25); display: flex; min-height: 900px;">
  <div style="width: 240px; flex: none; background: oklch(98% 0.003 25); border-right: 1px solid oklch(90% 0.004 25); padding: 24px 16px; display: flex; flex-direction: column; gap: 2px;">
    <div style="font-size: 18px; font-weight: 800; padding: 0 10px; margin-bottom: 24px;">XƏBƏR<span style="color: oklch(54% 0.22 25);">CMS</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>Dashboard</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="newspaper" style="width: 18px; height: 18px;"></i>Xəbərlər</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="folder-tree" style="width: 18px; height: 18px;"></i>Kateqoriyalar</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: oklch(54% 0.22 25); color: #fff; border-radius: 4px; font-size: 14px; font-weight: 700;"><i data-lucide="image" style="width: 18px; height: 18px;"></i>Media</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="message-square" style="width: 18px; height: 18px;"></i>Şərhlər</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="users" style="width: 18px; height: 18px;"></i>İstifadəçilər</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="megaphone" style="width: 18px; height: 18px;"></i>Reklam</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="search-check" style="width: 18px; height: 18px;"></i>SEO</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600;"><i data-lucide="history" style="width: 18px; height: 18px;"></i>Fəaliyyət jurnalı</div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: oklch(35% 0.006 25); font-size: 14px; font-weight: 600; margin-top: auto;"><i data-lucide="settings" style="width: 18px; height: 18px;"></i>Tənzimləmələr</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column;">
    <div style="height: 64px; border-bottom: 1px solid oklch(90% 0.004 25); display: flex; align-items: center; justify-content: space-between; padding: 0 32px;">
      <div style="font-size: 18px; font-weight: 800;">Media Kitabxanası</div>
      <div style="display: flex; align-items: center; gap: 20px;"><i data-lucide="bell" style="width: 20px; height: 20px;"></i><div style="width: 32px; height: 32px; border-radius: 50%; background: oklch(90% 0.004 25);"></div></div>
    </div>
    <div style="padding: 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 8px; border: 1px solid oklch(90% 0.004 25); border-radius: 2px; padding: 8px 12px; width: 260px;"><i data-lucide="search" style="width: 16px; height: 16px; color: oklch(40% 0.006 25);"></i><span style="font-size: 13px; color: oklch(40% 0.006 25);">Media axtar...</span></div>
        <button style="display: flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 700; font-size: 14px; padding: 11px 18px; background: oklch(54% 0.22 25); color: #fff; border: none; border-radius: 2px;"><i data-lucide="upload" style="width: 16px; height: 16px;"></i>Yüklə</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;">
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px; position: relative;"><div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;"><div style="width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 13px solid oklch(60% 0.006 25);"></div></div></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
        <div style="aspect-ratio: 1; background: repeating-linear-gradient(45deg, oklch(93% 0.004 25), oklch(93% 0.004 25) 8px, oklch(97% 0.003 25) 8px, oklch(97% 0.003 25) 16px); border-radius: 2px;"></div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() { return {}; }
}
</script>
</body>
</html>
